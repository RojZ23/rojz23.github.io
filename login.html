<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>.onion - Breach Unit Access</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Rajdhani:wght@300;400;600;700&family=IBM+Plex+Mono:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00ff41;
            --primary-glow: rgba(0, 255, 65, 0.5);
            --secondary: #ff0055;
            --secondary-glow: rgba(255, 0, 85, 0.5);
            --accent: #00ffff;
            --accent-glow: rgba(0, 255, 255, 0.4);
            --dark: #0a0e27;
            --darker: #050812;
            --border: rgba(0, 255, 65, 0.2);
            --text-primary: #e0e6ff;
            --text-secondary: rgba(224, 230, 255, 0.6);
            --text-dim: rgba(224, 230, 255, 0.3);
            --mono: 'IBM Plex Mono', monospace;
            --display: 'VT323', monospace;
            --sans: 'Rajdhani', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--darker);
            color: var(--text-primary);
            font-family: var(--mono);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Animated gradient background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(ellipse 200% 80% at 50% 0%, rgba(0, 255, 65, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse 200% 80% at 0% 100%, rgba(255, 0, 85, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse 200% 80% at 100% 100%, rgba(0, 255, 255, 0.03) 0%, transparent 50%);
            animation: gradientShift 15s ease infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes gradientShift {
            0%, 100% {
                filter: hue-rotate(0deg);
            }
            50% {
                filter: hue-rotate(10deg);
            }
        }

        /* Scanlines - subtle but present */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.08),
                rgba(0, 0, 0, 0.08) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 0 20px;
            animation: containerFadeIn 1s ease-out;
        }

        @keyframes containerFadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Top accent line */
        .accent-line {
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), var(--secondary), transparent);
            margin-bottom: 40px;
            box-shadow: 0 0 20px var(--primary-glow);
            animation: lineGlow 2s ease-in-out infinite;
        }

        @keyframes lineGlow {
            0%, 100% {
                box-shadow: 0 0 20px var(--primary-glow);
            }
            50% {
                box-shadow: 0 0 40px var(--primary-glow), 0 0 20px var(--secondary-glow);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-family: var(--display);
            font-size: 3rem;
            font-weight: bold;
            letter-spacing: 4px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            animation: logoGlow 3s ease-in-out infinite;
        }

        @keyframes logoGlow {
            0%, 100% {
                filter: drop-shadow(0 0 10px var(--primary-glow));
            }
            50% {
                filter: drop-shadow(0 0 20px var(--primary-glow)) drop-shadow(0 0 30px var(--accent-glow));
            }
        }

        .subtitle {
            font-size: 0.75rem;
            letter-spacing: 3px;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .subtext {
            font-size: 0.65rem;
            color: var(--text-dim);
            letter-spacing: 1px;
            font-style: italic;
        }

        .subtext::before {
            content: '▸ ';
            color: var(--secondary);
            margin-right: 4px;
        }

        /* Login panel */
        .login-panel {
            background: linear-gradient(135deg, rgba(10, 14, 39, 0.8) 0%, rgba(5, 8, 18, 0.9) 100%);
            border: 1px solid var(--border);
            border-radius: 2px;
            padding: 40px;
            position: relative;
            backdrop-filter: blur(10px);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(0, 255, 65, 0.1),
                0 0 40px rgba(0, 255, 65, 0.1);
            animation: panelGlow 4s ease-in-out infinite;
            overflow: hidden;
        }

        @keyframes panelGlow {
            0%, 100% {
                box-shadow: 
                    0 8px 32px rgba(0, 0, 0, 0.3),
                    inset 0 1px 0 rgba(0, 255, 65, 0.1),
                    0 0 40px rgba(0, 255, 65, 0.1);
            }
            50% {
                box-shadow: 
                    0 8px 32px rgba(0, 0, 0, 0.5),
                    inset 0 1px 0 rgba(0, 255, 65, 0.15),
                    0 0 60px rgba(0, 255, 65, 0.15);
            }
        }

        .login-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            animation: shimmer 3s infinite;
            pointer-events: none;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .warning-box {
            background: rgba(255, 0, 85, 0.08);
            border: 1px solid rgba(255, 0, 85, 0.3);
            border-radius: 2px;
            padding: 12px;
            margin-bottom: 24px;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .warning-text {
            font-size: 0.7rem;
            color: var(--secondary);
            letter-spacing: 1px;
            line-height: 1.6;
            text-transform: uppercase;
        }

        .warning-icon {
            display: inline-block;
            margin-right: 4px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
            z-index: 2;
        }

        .form-label {
            display: block;
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: var(--primary);
            text-transform: uppercase;
            margin-bottom: 8px;
            font-weight: 600;
            text-shadow: 0 0 10px var(--primary-glow);
        }

        .form-label::before {
            content: '❯ ';
            margin-right: 4px;
            color: var(--secondary);
        }

        .input-wrapper {
            position: relative;
        }

        .form-input {
            width: 100%;
            padding: 12px 14px;
            background: rgba(0, 255, 65, 0.03);
            border: 1px solid var(--border);
            border-radius: 2px;
            color: var(--text-primary);
            font-family: var(--mono);
            font-size: 0.9rem;
            letter-spacing: 1px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        .form-input::placeholder {
            color: var(--text-dim);
        }

        .form-input:focus {
            background: rgba(0, 255, 65, 0.08);
            border-color: var(--primary);
            box-shadow: 
                inset 0 1px 2px rgba(0, 0, 0, 0.2),
                0 0 15px var(--primary-glow),
                0 0 30px rgba(0, 255, 65, 0.2);
        }

        .form-input:focus::placeholder {
            color: var(--text-secondary);
        }

        .error-message {
            display: none;
            font-size: 0.7rem;
            color: var(--secondary);
            margin-top: 6px;
            letter-spacing: 0.5px;
            animation: slideDown 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .error-message.show {
            display: block;
        }

        .error-message::before {
            content: '⚠ ';
            margin-right: 4px;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-4px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-submit {
            width: 100%;
            padding: 14px;
            margin-top: 30px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            border: 1px solid var(--primary);
            border-radius: 2px;
            color: var(--darker);
            font-family: var(--mono);
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            z-index: 2;
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        .form-submit::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.6s ease;
            z-index: -1;
        }

        .form-submit:hover {
            background: linear-gradient(135deg, var(--accent) 0%, var(--primary) 100%);
            box-shadow: 0 8px 25px var(--accent-glow), 0 0 40px var(--primary-glow);
            transform: translateY(-2px);
        }

        .form-submit:hover::before {
            left: 100%;
        }

        .form-submit:active {
            transform: translateY(0);
        }

        .form-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            box-shadow: 0 4px 15px rgba(0, 255, 65, 0.2);
        }

        .success-message {
            display: none;
            font-size: 0.75rem;
            color: var(--primary);
            margin-top: 12px;
            text-align: center;
            letter-spacing: 1px;
            animation: slideDown 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-transform: uppercase;
            font-weight: 600;
            text-shadow: 0 0 8px var(--primary-glow);
        }

        .success-message.show {
            display: block;
        }

        .success-message::before {
            content: '✓ ';
            margin-right: 4px;
            color: var(--primary);
        }

        .footer {
            margin-top: 32px;
            padding-top: 16px;
            border-top: 1px solid rgba(0, 255, 65, 0.1);
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .footer-text {
            font-size: 0.65rem;
            color: var(--text-dim);
            letter-spacing: 1px;
            line-height: 1.8;
        }

        .status-dot {
            display: inline-block;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--primary);
            margin-right: 6px;
            animation: blink 1s ease-in-out infinite;
            box-shadow: 0 0 8px var(--primary-glow);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .corner-accent {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 1px solid var(--primary);
            pointer-events: none;
        }

        .corner-accent.tl {
            top: 0;
            left: 0;
            border-right: none;
            border-bottom: none;
        }

        .corner-accent.tr {
            top: 0;
            right: 0;
            border-left: none;
            border-bottom: none;
        }

        .corner-accent.bl {
            bottom: 0;
            left: 0;
            border-right: none;
            border-top: none;
        }

        .corner-accent.br {
            bottom: 0;
            right: 0;
            border-left: none;
            border-top: none;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .shake {
            animation: shake 0.4s ease-in-out;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .logo {
                font-size: 2.2rem;
            }

            .login-panel {
                padding: 30px;
            }

            .form-input {
                font-size: 16px; /* Prevent iOS zoom */
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="accent-line"></div>

        <div class="header">
            <h1 class="logo">BREACH</h1>
            <p class="subtitle">Unit Access Portal</p>
            <p class="subtext">Encrypted Network Gateway</p>
        </div>

        <div class="login-panel">
            <div class="corner-accent tl"></div>
            <div class="corner-accent tr"></div>
            <div class="corner-accent bl"></div>
            <div class="corner-accent br"></div>

            <div class="warning-box">
                <p class="warning-text">
                    <span class="warning-icon">⚠</span>
                    UNAUTHORIZED ACCESS PROHIBITED<br>
                    System Activity Monitored
                </p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">Access ID</label>
                    <div class="input-wrapper">
                        <input
                            type="text"
                            id="username"
                            class="form-input"
                            placeholder="Enter your credentials"
                            autocomplete="username"
                            required
                        >
                    </div>
                    <div class="error-message" id="usernameError"></div>
                </div>

                <div class="form-group">
                    <label class="form-label">Security Code</label>
                    <div class="input-wrapper">
                        <input
                            type="password"
                            id="password"
                            class="form-input"
                            placeholder="••••••••••••••••"
                            autocomplete="current-password"
                            required
                        >
                    </div>
                    <div class="error-message" id="passwordError"></div>
                </div>

                <div class="error-message" id="generalError"></div>
                <div class="success-message" id="successMessage">Access Granted - Initializing...</div>

                <button type="submit" class="form-submit" id="submitBtn">
                    AUTHENTICATE
                </button>
            </form>

            <div class="footer">
                <p class="footer-text">
                    <span class="status-dot"></span>
                    Secure Connection Established<br>
                    Encryption: AES-256 | Protocol: TLS 1.3<br>
                    Status: Online
                </p>
            </div>
        </div>
    </div>

    <script>
        // Configuration - Edit these credentials
        const VALID_USERNAME = 'BREACH2010';
        const VALID_PASSWORD = 'SLFirstSin';
        const REDIRECT_URL = 'BreachUnit.html';

        const form = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const usernameError = document.getElementById('usernameError');
        const passwordError = document.getElementById('passwordError');
        const generalError = document.getElementById('generalError');
        const successMessage = document.getElementById('successMessage');
        const submitBtn = document.getElementById('submitBtn');

        // Clear errors on focus
        usernameInput.addEventListener('focus', () => {
            usernameError.classList.remove('show');
        });

        passwordInput.addEventListener('focus', () => {
            passwordError.classList.remove('show');
            generalError.classList.remove('show');
        });

        // Form submission
        form.addEventListener('submit', (e) => {
            e.preventDefault();

            // Clear errors
            usernameError.classList.remove('show');
            passwordError.classList.remove('show');
            generalError.classList.remove('show');

            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            let hasError = false;

            if (!username) {
                usernameError.textContent = 'Access ID required';
                usernameError.classList.add('show');
                hasError = true;
            }

            if (!password) {
                passwordError.textContent = 'Security Code required';
                passwordError.classList.add('show');
                hasError = true;
            }

            if (hasError) {
                form.classList.add('shake');
                setTimeout(() => form.classList.remove('shake'), 400);
                return;
            }

            // Disable button during authentication
            submitBtn.disabled = true;
            submitBtn.textContent = 'AUTHENTICATING...';

            // Simulate authentication delay
            setTimeout(() => {
                if (username === VALID_USERNAME && password === VALID_PASSWORD) {
                    // Success
                    successMessage.classList.add('show');
                    form.style.opacity = '0.6';
                    submitBtn.style.opacity = '0.6';

                    // Redirect
                    setTimeout(() => {
                        window.location.href = REDIRECT_URL;
                    }, 1800);
                } else {
                    // Failed
                    form.classList.add('shake');
                    setTimeout(() => form.classList.remove('shake'), 400);

                    if (username !== VALID_USERNAME) {
                        usernameError.textContent = 'Invalid access credentials';
                        usernameError.classList.add('show');
                    } else {
                        passwordError.textContent = 'Incorrect security code';
                        passwordError.classList.add('show');
                    }

                    submitBtn.disabled = false;
                    submitBtn.textContent = 'AUTHENTICATE';
                    passwordInput.value = '';
                    passwordInput.focus();
                }
            }, 1000);
        });

        // Focus on load
        window.addEventListener('load', () => {
            usernameInput.focus();
        });

        // Enter key support
        [usernameInput, passwordInput].forEach(input => {
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && !submitBtn.disabled) {
                    form.dispatchEvent(new Event('submit'));
                }
            });
        });
    </script>
</body>
</html>
