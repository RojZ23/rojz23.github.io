<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Second Lives Universe — Personnel &amp; Specimen Archive</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23090d0c'/%3E%3Ccircle cx='12' cy='12' r='6.2' fill='none' stroke='%2335D6AC' stroke-width='2'/%3E%3Ccircle cx='12' cy='12' r='1.7' fill='%23E8452E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
/* ============ RESET & BASE ============ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#090D0C;
  --bg-alt:#0D1311;
  --surface:#121815;
  --surface-2:#182019;
  --line:#233029;
  --line-soft:#161E19;
  --ink:#E7EFE9;
  --ink-dim:#A9B8AF;
  --muted:#6C7C73;
  --teal:#35D6AC;
  --teal-dim:rgba(53,214,172,.13);
  --red:#E8452E;
  --red-dim:rgba(232,69,46,.14);
  --amber:#D8A73D;
  --amber-dim:rgba(216,167,61,.14);
  --accent:var(--teal);
  --accent-dim:var(--teal-dim);
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'IBM Plex Sans',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
  --header-h:66px;
  --sidebar-w:308px;
}
.accent-parasite{--accent:var(--red);--accent-dim:var(--red-dim);}
html{scroll-behavior:smooth;}
body{
  font-family:var(--font-body);
  background:
    radial-gradient(1100px 760px at 14% -8%, rgba(53,214,172,.06), transparent 60%),
    radial-gradient(1000px 700px at 104% 0%, rgba(232,69,46,.05), transparent 55%),
    var(--bg);
  color:var(--ink);
  min-height:100vh;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--teal);color:#04120D;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:var(--bg-alt);}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;}
::-webkit-scrollbar-thumb:hover{background:var(--muted);}
a{color:inherit;text-decoration:none;}
ul,ol{list-style:none;}
button{font:inherit;background:none;border:none;color:inherit;cursor:pointer;}
input{font:inherit;color:inherit;}
h1,h2,h3{font-family:var(--font-display);font-weight:600;letter-spacing:-.01em;}
p{color:var(--ink-dim);}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

/* ============ UTILITIES ============ */
.eyebrow{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);}
.xref{color:var(--accent);border-bottom:1px solid currentColor;padding-bottom:1px;transition:opacity .15s;}
.xref:hover{opacity:.72;}
.code{font-family:var(--font-mono);color:var(--ink-dim);font-size:.92em;}
.bracket{position:relative;}
.bracket::before,.bracket::after{content:'';position:absolute;width:12px;height:12px;border-color:var(--accent);border-style:solid;border-width:0;opacity:.85;}
.bracket::before{top:-1px;left:-1px;border-top-width:2px;border-left-width:2px;}
.bracket::after{bottom:-1px;right:-1px;border-bottom-width:2px;border-right-width:2px;}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;}
.chip{font-family:var(--font-mono);font-size:.76rem;padding:6px 12px;border:1px solid var(--line);border-radius:999px;color:var(--ink-dim);background:var(--surface);transition:.15s;}
.chip:hover{border-color:var(--accent);color:var(--ink);}
.fade-in{animation:fadeInUp .45s ease both;}
@keyframes fadeInUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.flash{animation:flashHi 1.1s ease;}
@keyframes flashHi{0%{background:var(--accent-dim);}100%{background:transparent;}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important;}
}

/* ============ TOPBAR ============ */
.topbar{
  position:sticky;top:0;z-index:40;
  height:var(--header-h);
  display:flex;align-items:center;gap:20px;
  padding:0 22px;
  background:rgba(9,13,12,.9);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.menu-btn{display:none;width:36px;height:36px;align-items:center;justify-content:center;color:var(--ink-dim);flex-shrink:0;}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.brand-mark{width:30px;height:30px;flex-shrink:0;}
.brand-text{display:flex;flex-direction:column;line-height:1.1;}
.brand-title{font-family:var(--font-display);font-weight:700;font-size:1.02rem;letter-spacing:.02em;}
.brand-sub{font-family:var(--font-mono);font-size:.62rem;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;}
.search-wrap{position:relative;flex:1;max-width:380px;margin-left:auto;}
.search-input{
  width:100%;background:var(--surface);border:1px solid var(--line);color:var(--ink);
  padding:9px 14px 9px 36px;border-radius:6px;font-size:.86rem;transition:border-color .15s;
}
.search-input:focus{border-color:var(--accent);outline:none;}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);pointer-events:none;}
.search-results{
  position:absolute;top:calc(100% + 8px);left:0;right:0;
  background:var(--surface-2);border:1px solid var(--line);border-radius:8px;
  max-height:420px;overflow-y:auto;display:none;box-shadow:0 20px 40px rgba(0,0,0,.5);
}
.search-results.open{display:block;}
.sr-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line-soft);}
.sr-item:last-child{border-bottom:none;}
.sr-item:hover,.sr-item:focus{background:var(--surface);}
.sr-name{font-size:.88rem;color:var(--ink);}
.sr-cat{font-family:var(--font-mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);}
.sr-empty{padding:16px 14px;color:var(--muted);font-size:.84rem;}

/* ============ LAYOUT ============ */
.layout{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:calc(100vh - var(--header-h));}
.backdrop{display:none;}

/* ============ SIDEBAR ============ */
.sidebar{
  border-right:1px solid var(--line);
  padding:18px 12px 60px;
  height:calc(100vh - var(--header-h));position:sticky;top:var(--header-h);overflow-y:auto;
}
.nav-home{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:6px;
  font-family:var(--font-mono);font-size:.8rem;letter-spacing:.04em;color:var(--ink-dim);margin-bottom:14px;
  border:1px solid var(--line);
}
.nav-home:hover{color:var(--ink);border-color:var(--accent);}
.nav-home svg{width:15px;height:15px;flex-shrink:0;}
.nav-home.is-active{color:var(--teal);border-color:var(--teal);background:var(--teal-dim);}

.nav-group{margin-bottom:4px;border-radius:6px;overflow:hidden;}
.nav-group-head{display:flex;align-items:stretch;border-radius:6px;}
.nav-cat-link{
  flex:1;display:flex;align-items:center;gap:8px;padding:9px 6px 9px 12px;
  font-family:var(--font-mono);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim);
  border-radius:6px 0 0 6px;
}
.nav-group.danger .nav-cat-link{color:#F3A292;}
.nav-cat-link:hover,.nav-cat-link.is-active{color:var(--ink);background:var(--surface);}
.nav-group.danger .nav-cat-link:hover,.nav-group.danger .nav-cat-link.is-active{background:var(--red-dim);color:#FFD3C6;}
.nav-bio{width:13px;height:13px;color:var(--red);flex-shrink:0;}
.nav-label{flex:1;}
.nav-count{font-size:.68rem;color:var(--muted);}
.nav-toggle{width:34px;display:flex;align-items:center;justify-content:center;color:var(--muted);border-radius:0 6px 6px 0;}
.nav-toggle:hover{color:var(--ink);background:var(--surface);}
.nav-toggle span{display:inline-block;transition:transform .2s ease;font-size:.7rem;}
.nav-group.open .nav-toggle span{transform:rotate(180deg);}
.nav-children{max-height:0;overflow:hidden;transition:max-height .25s ease;padding-left:14px;border-left:1px solid var(--line-soft);margin-left:18px;}
.nav-group.open .nav-children{max-height:900px;}
.nav-child{
  display:block;padding:7px 10px;font-size:.82rem;color:var(--ink-dim);border-radius:4px;
  border-left:2px solid transparent;
}
.nav-child:hover{color:var(--ink);background:var(--surface);}
.nav-child.is-active{color:var(--teal);border-left-color:var(--teal);background:var(--teal-dim);}
.nav-group.danger .nav-child.is-active{color:var(--red);border-left-color:var(--red);background:var(--red-dim);}
.nav-foot{margin-top:18px;padding:12px;font-family:var(--font-mono);font-size:.66rem;color:var(--muted);line-height:1.6;border-top:1px solid var(--line-soft);}

/* ============ CONTENT ============ */
.content{overflow-y:auto;height:calc(100vh - var(--header-h));}
.content-inner{max-width:980px;margin:0 auto;padding:38px 34px 100px;}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-family:var(--font-mono);font-size:.74rem;color:var(--muted);margin-bottom:26px;}
.crumbs a:hover{color:var(--accent);}
.crumbs .sep{opacity:.5;}
.crumbs .current{color:var(--ink-dim);}

/* ---- HERO / HOME ---- */
.hero{border:1px solid var(--line);background:linear-gradient(180deg,var(--surface),var(--bg-alt));border-radius:12px;padding:40px 36px;margin-bottom:36px;position:relative;overflow:hidden;}
.hero-tag{display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:18px;flex-wrap:wrap;}
.hero-tag .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 8px var(--teal);animation:blink 2.4s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.25;}}
.hero h1{font-size:2.7rem;line-height:1.05;margin-bottom:10px;}
.hero h1 span{color:var(--teal);}
.hero-sub{font-family:var(--font-mono);font-size:.82rem;color:var(--ink-dim);letter-spacing:.03em;margin-bottom:20px;}
.hero-desc{max-width:640px;font-size:.98rem;line-height:1.7;margin-bottom:28px;}
.hero-stats{display:flex;flex-wrap:wrap;gap:0;border-top:1px solid var(--line);padding-top:22px;}
.stat{padding:0 26px 0 0;margin-right:26px;border-right:1px solid var(--line);}
.stat:last-child{border-right:none;}
.stat-num{font-family:var(--font-display);font-size:1.7rem;font-weight:700;color:var(--ink);}
.stat-label{font-family:var(--font-mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:2px;}

.section-head{margin:44px 0 18px;}
.section-head h2{font-size:1.3rem;}
.section-head p{font-size:.9rem;margin-top:6px;max-width:600px;}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:20px;transition:.18s;display:flex;flex-direction:column;gap:10px;}
.tile:hover{border-color:var(--accent);transform:translateY(-2px);background:var(--surface-2);}
.tile-top{display:flex;align-items:center;justify-content:space-between;}
.tile-icon{width:26px;height:26px;color:var(--accent);}
.tile-count{font-family:var(--font-mono);font-size:.72rem;color:var(--muted);border:1px solid var(--line);padding:2px 8px;border-radius:999px;}
.tile-title{font-family:var(--font-display);font-weight:600;font-size:1.06rem;}
.tile-desc{font-size:.84rem;color:var(--ink-dim);line-height:1.55;}

/* ---- CARD GRID (category listing) ---- */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
.p-card{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:18px 18px 20px;transition:.18s;position:relative;}
.p-card:hover{border-color:var(--accent);transform:translateY(-2px);background:var(--surface-2);}
.p-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;}
.p-card-name{font-family:var(--font-display);font-weight:600;font-size:1.08rem;line-height:1.25;}
.p-card-tag{font-family:var(--font-mono);font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);border:1px solid currentColor;padding:3px 7px;border-radius:4px;white-space:nowrap;flex-shrink:0;}
.p-card-role{font-family:var(--font-mono);font-size:.72rem;color:var(--muted);margin-bottom:10px;}
.p-card-blurb{font-size:.86rem;color:var(--ink-dim);line-height:1.55;}

/* ---- FILE PAGE ---- */
.file-head{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:30px 32px;margin-bottom:8px;}
.stamp{
  position:absolute;top:22px;right:26px;transform:rotate(-4deg);
  font-family:var(--font-mono);font-weight:600;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);border:2px solid var(--accent);padding:5px 12px;border-radius:2px;background:var(--accent-dim);
  display:flex;align-items:center;gap:6px;
}
.stamp svg{width:14px;height:14px;}
.file-head .eyebrow{margin-bottom:10px;}
.file-head h1{font-size:2.1rem;line-height:1.15;max-width:78%;margin-bottom:16px;}
.meta-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px 24px;border-top:1px solid var(--line);padding-top:18px;}
.meta-item{display:flex;flex-direction:column;gap:4px;}
.meta-k{font-family:var(--font-mono);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
.meta-v{font-size:.88rem;color:var(--ink);line-height:1.4;}

.file-section{padding:26px 4px;border-bottom:1px solid var(--line-soft);}
.file-section:last-of-type{border-bottom:none;}
.file-section h2{font-size:1rem;font-family:var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:14px;font-weight:600;}
.file-section p{margin-bottom:12px;font-size:.96rem;line-height:1.75;color:var(--ink-dim);}
.file-section p:last-child{margin-bottom:0;}
.file-section ul,.file-section ol{display:flex;flex-direction:column;gap:10px;}
.file-section li{font-size:.94rem;line-height:1.6;color:var(--ink-dim);padding-left:20px;position:relative;}
.file-section ul li::before{content:'';position:absolute;left:0;top:.6em;width:6px;height:6px;background:var(--accent);border-radius:1px;}
.file-section ol{counter-reset:ol;}
.file-section ol li{counter-increment:ol;}
.file-section ol li::before{content:counter(ol);position:absolute;left:0;top:0;font-family:var(--font-mono);font-size:.72rem;color:var(--accent);font-weight:600;}
.rel-list li{padding-left:0;}
.rel-list li::before{display:none;}
.rel-name{display:inline-block;font-weight:600;margin-bottom:3px;}
.rel-text{display:block;font-size:.9rem;color:var(--ink-dim);line-height:1.6;}

.quotes{display:flex;flex-direction:column;gap:14px;}
.quotes blockquote{
  font-family:var(--font-body);font-style:italic;font-size:1.08rem;line-height:1.65;color:var(--ink);
  border-left:2px solid var(--accent);padding:2px 0 2px 20px;
}

.backlinks h2{color:var(--muted);}

/* ---- STAFF / MISC / AFFILIATIONS ---- */
.staff-division{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:16px;overflow:hidden;}
.staff-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);background:var(--surface-2);}
.staff-head h3{font-family:var(--font-display);font-size:1rem;}
.staff-head .tile-count{flex-shrink:0;}
.roster{display:flex;flex-direction:column;}
.roster-row{display:grid;grid-template-columns:1fr 110px 1.4fr;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line-soft);align-items:center;}
.roster-row:last-child{border-bottom:none;}
.roster-name{font-size:.9rem;color:var(--ink);}
.roster-id{font-family:var(--font-mono);font-size:.76rem;color:var(--muted);}
.roster-role{font-size:.86rem;color:var(--ink-dim);}
.roster-row.head{background:transparent;padding-top:0;padding-bottom:8px;}
.roster-row.head span{font-family:var(--font-mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}

.note-grid,.aff-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}
.note-card,.aff-card{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:20px;scroll-margin-top:90px;}
.note-card h3,.aff-card h3{font-family:var(--font-display);font-size:1.02rem;margin-bottom:10px;}
.note-card p,.aff-card p{font-size:.88rem;line-height:1.6;margin-bottom:12px;}
.aff-card ul{display:flex;flex-direction:column;gap:8px;}
.aff-card li{font-size:.86rem;color:var(--ink-dim);display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line-soft);padding-bottom:8px;}
.aff-card li:last-child{border-bottom:none;padding-bottom:0;}
.aff-role{color:var(--muted);font-family:var(--font-mono);font-size:.72rem;text-align:right;flex-shrink:0;}

.staff-division,.note-card,.aff-card{scroll-margin-top:90px;}

/* ---- PARASITE BANNER ---- */
.threat-banner{border:1px solid var(--red);background:var(--red-dim);border-radius:10px;padding:18px 22px;margin-bottom:26px;display:flex;align-items:center;gap:14px;}
.threat-banner svg{width:30px;height:30px;color:var(--red);flex-shrink:0;}
.threat-banner-text{font-family:var(--font-mono);font-size:.8rem;color:#FFD3C6;letter-spacing:.02em;line-height:1.5;}
.threat-banner-text b{color:#fff;}

footer.site-footer{border-top:1px solid var(--line);margin-top:40px;padding:28px 4px 10px;font-family:var(--font-mono);font-size:.72rem;color:var(--muted);line-height:1.7;}

/* ============ RESPONSIVE ============ */
@media (max-width:900px){
  :root{--sidebar-w:280px;}
  .menu-btn{display:flex;}
  .layout{grid-template-columns:1fr;}
  .sidebar{
    position:fixed;top:var(--header-h);left:0;bottom:0;width:var(--sidebar-w);
    background:var(--bg);z-index:50;transform:translateX(-105%);transition:transform .28s ease;
    height:calc(100vh - var(--header-h));
  }
  .sidebar.open{transform:translateX(0);box-shadow:20px 0 40px rgba(0,0,0,.5);}
  .backdrop{display:none;position:fixed;inset:var(--header-h) 0 0 0;background:rgba(0,0,0,.55);z-index:45;}
  .backdrop.open{display:block;}
  .content{height:auto;}
  .content-inner{padding:28px 18px 80px;}
  .hero{padding:26px 20px;}
  .hero h1{font-size:1.9rem;}
  .search-wrap{max-width:none;}
  .brand-sub{display:none;}
  .file-head{padding:22px 20px;}
  .file-head h1{max-width:100%;font-size:1.6rem;}
  .stamp{position:static;transform:rotate(0);display:inline-flex;margin-bottom:14px;}
  .roster-row{grid-template-columns:1fr;gap:2px;}
  .roster-id,.roster-role{font-size:.78rem;}
}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="menu-btn" id="menuBtn" aria-label="Toggle navigation">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <a href="#home" class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#0D1311" stroke="#233029"/><circle cx="12" cy="12" r="6.2" fill="none" stroke="#35D6AC" stroke-width="2"/><circle cx="12" cy="12" r="1.7" fill="#E8452E"/></svg>
      <span class="brand-text">
        <span class="brand-title">SECOND LIVES</span>
        <span class="brand-sub">Personnel &amp; Specimen Archive</span>
      </span>
    </a>
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" class="search-input" id="searchInput" placeholder="Search the archive…" autocomplete="off">
      <div class="search-results" id="searchResults"></div>
    </div>
  </header>

  <div class="layout">

const CORE = [{"id": "jack", "short": "Jack", "name": "THETA-09 \"JACK\"", "stamp": "THETA-09", "category": "core", "meta": [["Alias", "Jack"], ["Status (2014)", "Alive, active"], ["Type", "Human clone with fragmented memory implants"], ["Created By", "Dr. Elias Kain"], ["Control", "Division 9 (classified)"]], "blurb": "A memory-imprinted clone reawakened years after the Nova Crest Outbreak, caught between being someone and being something.", "sections": [{"h": "Background", "body": ["Theta-09 is one of three successful, classified clone experiments conducted in secret by Dr. Elias Kain before the 2010 Nova Crest Outbreak. He is not merely a clone of flesh \u2014 he is a vessel imprinted with carefully selected, fragmented memories drawn from multiple sources: Dr. Kain's grief, guilt, and scientific intent; memories of lost test subjects; and fragments of Kain's own family.", "These memories were not designed to create a copy, but something new \u2014 something haunted. Jack does not always know what is real and what was implanted. Awakened years after the outbreak inside a restricted cryo-lab, his reawakening is the pivotal turning point of the story."]}, {"h": "Personality", "body": ["Reserved, introspective, and fragmented \u2014 a man caught between being someone and being something. He speaks rarely, trying to piece together memories and things. Haunted by visions and voices from moments he never lived. Occasionally channels Kain's pain or speech patterns, which disturbs others and even himself. Oscillates between guilt and anger."]}, {"h": "Abilities / Enhancements", "list": ["Accelerated muscle memory: instinctively skilled in survival and combat without knowing why", "Neuro-imprinted reflexes: can hack terminals and handle weapons via preloaded training memories", "Biotech immunity: partial parasite resistance \u2014 not immune, but slower to be affected", "Memory triggers: certain objects or people cause violent or emotional memory spikes, sometimes triggering personality overlays or seizures"]}, {"h": "Key Relationships", "rel": [{"ref": "kain", "name": "Dr. Kain", "text": "Connected genetically and mnemonically. Kain sees him as son, clone, and penance. Their relationship fractures when Jack realizes he was never meant to have a choice."}, {"ref": "rachel", "name": "Rachel A.", "text": "Suspected to have tampered with his neural matrix while he was in cryo. Sees him as a useful test subject, nothing more."}, {"ref": "kira", "name": "Kira", "text": "Potential early ally \u2014 Jack's subconscious memories may tip Kira off to the true scope of the cloning project."}, {"ref": "asher", "name": "Asher", "text": "Asher calls him \"the key they're afraid of.\""}]}, {"h": "Possible Twist", "body": ["Jack may be a composite of more than one person \u2014 a mosaic clone built from multiple subjects, potentially including Kain's own child. His instability isn't a bug; it's designed. He's not a clone of one man. He's the memory of a family, wrapped in skin."]}], "quotes": ["I wasn't born. I was broken before I opened my eyes."]}, {"id": "kain", "short": "Dr. Kain", "name": "DR. ELIAS KAIN / \"DR. JOHN\"", "stamp": "SL-0001", "category": "core", "meta": [["Role", "Founder of Second Lives Corporation, Chief Scientist"], ["Status (2014)", "Alive, under military supervision"], ["Age in 2010", "Mid-to-late 40s"], ["SL-ID", "SL-0001"]], "blurb": "The brilliant, grief-driven founder of Second Lives \u2014 split between the man who created it and the persona forced to obey Division 9.", "sections": [{"h": "Background", "body": ["Once a brilliant biotechnologist, Dr. Elias Kain founded Second Lives Corporation driven by one obsession: defeating death. His motivation was intensely personal \u2014 he had lost his family in a preventable accident and believed resurrection was not just possible but morally necessary. His philosophy: \"No one should be defined by the day they died.\"", "Under his leadership, Second Lives pioneered the Memory Retention Core, early cloning prototypes, and neural parasite containment technology. He built Nova Crest City as a biotech utopia. He also secretly created the Theta-09 program, embedding fragments of his own grief and memories into Jack \u2014 a hidden key he planted against the military's full control.", "After the 2010 Nova Crest Outbreak \u2014 caused by Rachel's sabotage \u2014 Kain was forced to sign over Second Lives to Division 9 under duress. Then, during the public protests that followed, a military convoy truck crashed into a crowd, killing his wife Amelia and their children. The military rebranded him \"Dr. John,\" stripping his authority and identity."]}, {"h": "Personality", "body": ["Calm, melancholic, authoritative \u2014 until he slips into the \"John\" persona, which is cold, detached, and utilitarian. A tragic idealist who still clings to the belief his work had purpose. Obsessively brilliant, emotionally repressed, fractured between two identities."]}, {"h": "Dual Identity", "list": ["\"Dr. Kain\" = The man who loved, grieved, and created Second Lives for hope", "\"Dr. John\" = The man who obeys, erases names, and helps build obedient soldiers"]}, {"h": "Scientific Contributions", "list": ["Inventor of the Memory Retention Core", "Creator of the first fully functional memory-integrated clone (Theta-09/Jack)", "Pioneer of early parasite suppression and neural adaptation tech", "Creator of Fragmented Personality Mapping Systems"]}, {"h": "Secret", "body": ["May have created more than one perfect clone. One failed. One vanished."]}, {"h": "Symbolism", "body": ["Kain = Cain (biblical first killer \u2014 fitting for a man whose creation caused mass death).", "Dr. John = the mask, submission, erasure of humanity under control."]}], "quotes": ["I didn't bring them back for power. I brought them back because I couldn't bear the silence.", "They call me John now. It helps them forget who I used to be. I wish I could forget, too.", "Jack... I see her in you. The way you look away when you lie."]}, {"id": "keir", "short": "Gen. Keir", "name": "GENERAL NATHANIEL KEIR", "stamp": "DIV. 9", "category": "core", "meta": [["Role", "Antagonist / Head of Division 9, Department of Advanced Warfare"], ["Status (2014)", "Alive, high clearance"], ["Age", "55"]], "blurb": "A cold, disciplined architect of scientific authoritarianism who orchestrated the Nova Crest disaster to justify military seizure of Second Lives.", "sections": [{"h": "Background", "body": ["Nathaniel Keir's character was forged in a brutal military academy where his father enrolled him at thirteen. He arrived quiet and disciplined, making him a target for older cadets who mocked, isolated, and physically abused him. He learned to endure in silence \u2014 his father made clear that complaint was weakness. By sixteen, barely sleeping and living in constant tension, the emotional pressure finally broke, and he attacked a cadet with terrifying violence.", "His father's response permanently shaped him: instead of anger at the violence, his father was disappointed Nathaniel had acted like a frightened civilian rather than someone in control. He was then punished through isolation, physical drills, and repeated lessons about discipline, psychological dominance, and leaving no evidence behind.", "That experience permanently restructured him: emotion became something to conceal; violence became something to use strategically, and control became the highest moral value. Rising through U.S. military intelligence, Keir became obsessed with biotech warfare. By 2008 he was head of Division 9. He orchestrated Operation Eclipse Nest, planting Rachel A. inside Second Lives to trigger a controlled disaster that would justify military seizure."]}, {"h": "Vision \u2014 Scientific Authoritarianism", "list": ["Cloned governors trained from birth", "Obedient soldiers preloaded with loyalty", "Parasites as neural regulators to suppress disobedience", "Memory-replacement protocols tested on select political leaders"]}, {"h": "Personality", "body": ["Deep, calm, and deliberate. Never yells, never rushes. Speaks with legal finality \u2014 every sentence feels like an executive order. Uses silence as his most powerful tool. Doesn't threaten; he simply states what will happen. Has no real \"enemies\" \u2014 only assets, threats, or tools."]}, {"h": "Secret", "body": ["He may be testing memory-replacement protocols on select political leaders. His own past may be fabricated \u2014 he could be a clone himself."]}], "quotes": ["Soldiers follow orders. What if a president could too?", "They were scientists playing God. I just gave God a uniform.", "A perfect army is obedient. A perfect society doesn't question. We now have both."]}, {"id": "rachel", "short": "Rachel Adler", "name": "RACHEL ADLER / RACHEL A.", "stamp": "SL-0047", "category": "core", "meta": [["Role", "Military bio-intelligence agent; Civilian Director of Hemeon Research Group"], ["Cover Identity (Pre-2010)", "Senior Researcher at Second Lives"], ["SL-ID", "SL-0047"], ["Age in 2014", "43"]], "blurb": "The embedded Division 9 operative who sabotaged Second Lives from within \u2014 driven by grief, fear, and a belief in state-controlled science.", "sections": [{"h": "Background", "body": ["Rachel grew up the daughter of a government scientist killed in a mysterious containment failure in a remote village in 1967. She witnessed her father's death as a direct result of private negligence and government secrecy. On top of the grief, her family was blamed by others afterward \u2014 leaving her with both loss and shame.", "The military looked like the only place strong enough to protect her from chaos. When Keir approached her, he didn't need to appeal to hatred; he only needed to speak to her fear and exhaustion, promising structure, certainty, and a way to ensure no other family would be destroyed by random collapse. By 2007, she was embedded inside Second Lives under Operation Eclipse Nest."]}, {"h": "The Nova Crest Outbreak \u2014 Her Orchestration", "list": ["Tampered with parasite samples marked as stabilized", "Overrode transfer protocols for a test subject in Sector B17", "Disabled communication lines, delaying emergency response by hours", "Leaked redacted footage to fringe journalists to shape public narrative"]}, {"h": "True Motive", "body": ["Rachel doesn't hate cloning or memory research \u2014 she believes it's the future. But Second Lives was reckless and motivated by grief and profit. She destroyed it not to end it, but to rebuild it under government discipline. Over time, her ideology twisted: instead of saving the world, she began choosing who deserved to lead it."]}, {"h": "Personality", "body": ["Sharp, intelligent, emotionally detached. Carries real belief in scientific progress \u2014 but only when state-controlled. Hates inefficiency, sentiment, and rebellion. She respects Keir but fears him."]}, {"h": "Secrets", "list": ["May have protected one clone from deletion \u2014 possibly due to guilt or attachment", "Collects personal artifacts from terminated clones", "Designed the Memory Retention Chambers and Fragmented Personality Mapping System"]}], "quotes": ["The parasites were never the threat. The real threat was letting private hands play God without oversight."]}, {"id": "kira", "short": "Kira Daniels", "name": "KIRA DANIELS", "stamp": "BREACH UNIT", "category": "core", "meta": [["Role", "Lead Investigative Journalist, Public Face & Founder of Breach Unit"], ["Status (2014)", "Active resistance leader"], ["Voice", "Southern/Texas accent \u2014 confident, grounded, passionate"]], "blurb": "A fearless journalist turned resistance leader, driven by the unresolved disappearance of her brother during the Nova Crest Outbreak.", "sections": [{"h": "Background", "body": ["Born in rural West Texas, Kira was raised by a father who distrusted government narratives and a mother who valued knowledge and skepticism. That upbringing made her a natural journalist. In the 2000s, she built her career exposing corruption in biotech corporations, gaining a reputation for fearlessness and credibility.", "The breaking point came with the 2010 Nova Crest Outbreak \u2014 she lost her younger brother in the disaster. Officials provided no answers; Second Lives denied involvement, and Division 9 buried the evidence. She never found out if her brother was dead or alive, and that unanswered grief drives everything she does. In response, she founded the Breach Unit: publicly a media collective, secretly an anti\u2013Second Lives intelligence cell."]}, {"h": "Motivations", "list": ["Personal: Find the truth about her brother's fate", "Professional: Expose the corruption of Second Lives and its Division 9 handlers", "Moral: Protect civilians from the biotech horrors that caused Nova Crest"]}, {"h": "Character Arc", "olist": ["Voice of the People \u2014 fearless reporter amplifying suppressed voices", "Moral Leader \u2014 grows into a strategist balancing truth with consequences", "The Dilemma \u2014 forced to choose between releasing all evidence or using it to negotiate for civilian lives", "Emotional Climax \u2014 learns the truth about her brother, shattering her but steeling her resolve"]}, {"h": "Personality", "body": ["Direct and charming \u2014 uses her accent and wit to disarm opponents. Stubborn as bedrock. Carries guilt over sources who disappeared or died. Protective of her team, often taking risks herself."]}, {"h": "Appearance", "body": ["Late 30s, sun-kissed complexion from fieldwork, long brown hair with lighter streaks, piercing green eyes. Leather jacket over a press vest, jeans, worn boots. Symbol: Breach Unit logo with a cracked eye lens."]}, {"h": "Secrets", "list": ["Her real name may not be \"Kira\" \u2014 she hides her past even from Asher", "She may be the daughter of a test subject; her blood might hold memory resistance"]}], "quotes": ["They think if you bury a body with a patent number, no one'll dig it up. We do.", "They want you to forget. They want you to numb. Don't give 'em satisfaction."]}, {"id": "asher", "short": "Asher Vance", "name": "ASHER VANCE", "stamp": "SL-0844", "category": "core", "meta": [["Full Name", "Asher Vance"], ["Position", "Junior Research Technician, Memory Architecture / Bio-Regenerative Tech"], ["Status (2014)", "Active on-site technician, covert investigator"], ["SL-ID", "SL-0844"], ["Affiliation", "Hemeon Research Group (Division 9-controlled)"], ["Later Becomes", "The Warden (parasite boss)"]], "blurb": "An undercover whistleblower documenting the truth about Hemeon from the inside \u2014 until the facility catches up with him.", "sections": [{"h": "Background", "body": ["A former investigative tech analyst fired after poking into Second Lives' data trails; Asher returned to the facility by going undercover \u2014 hired as a junior tech, secretly documenting everything he could. From day one he recognised the facility as something far darker than it appeared: a tightly controlled military operation masquerading as a research centre. He began keeping covert audio logs (coded under initials \"A.V.\") to document strange occurrences and preserve fragments of truth others wanted to erase."]}, {"h": "Key Investigations", "list": ["Heard unexplained chanting in sealed \"Maintenance Only\" hallways \u2014 no source found", "Repeatedly spotted Rachel A. (not listed on any manifest) accessing restricted cryo-labs and staring at active stasis pods", "Documented the disappearance of neuro-sync lab notes and prototype biomod files, coinciding with camera blind spots", "Noticed Dr. Kain insisting on the alias \"Dr. John,\" whose history was sanitized and classified", "Described the whole facility as feeling less like research and more like a military occupation"]}, {"h": "Personal Motivation", "body": ["He hates the manipulation of truth, especially after someone he loved was lost to early trials. Has personal stakes he keeps hidden even from Leo."]}, {"h": "Personality", "body": ["Curious and observant. Cautious but persistent. Sceptical of management. Lonely and anxious \u2014 often speaks to his logs just to stay grounded."]}, {"h": "Secrets", "list": ["May be suffering memory degradation himself \u2014 unsure what is real", "Possibly exposed to a dormant parasite strain in the lab", "His whistleblowing is eventually discovered by the military; he is captured and transformed into the Warden"]}], "quoteLabel": "Key Quotes from Audio Logs", "quotes": ["Day one. The place is massive. Cold, sterile, like a defense contractor's dream... but everything's locked behind six NDAs.", "Rachel A. \u2014 she's not on any manifest. Yet she walks through sealed sectors like she owns the place. She's staring at an active pod like it's alive. Because it is.", "Neuro-sync notes are gone. Prototype biomods are missing. Cameras had blind spots. Someone's erasing the truth here."]}, {"id": "thorne", "short": "Michael Thorne", "name": "MICHAEL THORNE", "stamp": "SENATE", "category": "core", "meta": [["Role", "Politician / U.S. Senate Candidate"], ["Status (2014)", "Active campaign \u2014 running for United States Senator"], ["Affiliation", "Independent / public political figure; covert interest in Nova Crest assets"], ["Health Status", "Terminally ill \u2014 classified, no known cure"]], "blurb": "A polished, terminally ill senate candidate quietly maneuvering to seize Nova Crest's biotech for himself before he runs out of time.", "sections": [{"h": "Background", "body": ["Thorne is the politician people believe in \u2014 articulate, composed, never rattled in interviews, the kind of man who makes a crowded room feel like he's only talking to you. His campaign, Thorne for America, pitches him as a reformer: anti-corruption, pro-infrastructure, a steady hand. He doesn't promise miracles. He promises competence. Voters find that refreshing. His opponents find him almost impossible to attack \u2014 there's nothing visibly wrong with him."]}, {"h": "Appearance", "body": ["Late 40s, sharp-jawed and immaculately presented. Dark hair slicked back with precision. Ice-blue eyes that hold eye contact with a beat too long \u2014 not threatening, just unnerving. Always in a three-piece charcoal suit, pocket square folded perfectly, a small gold pin on his lapel. Campaign slogan: Leadership. Integrity. Progress. He looks like the answer to every question a voter could ask. That's the point."]}, {"h": "The Secret \u2014 Terminal Illness", "body": ["Thorne is dying. The illness is progressive and untreatable by any conventional or experimental medicine he has been able to access quietly. He has kept it completely hidden \u2014 no aides know, no doctor on record; nothing that could surface in opposition research. To the world, he is vigorous, sharp, and built for a long career. Privately, he is running out of time and he knows it."]}, {"h": "The Pivot \u2014 Nova Crest", "body": ["While conducting political research into decommissioned federal projects to build his anti-corruption platform, Thorne's team uncovered fragments of the old Second Lives / Nova Crest files. What was buried as a classified disaster, Thorne read as something else entirely: a near-complete solution to everything he was dying from. Memory retention. Cellular regeneration. Cloning. A programme that had gotten further than anything medicine had tried on him \u2014 and then been locked away.", "He didn't go to Division 9. He didn't alert anyone. He quietly redirected resources, bought silence where he needed it, and began positioning himself to claim the project entirely \u2014 not to restart it for the public good, but to finish it for himself. The Senate seat isn't the goal. It's the key. The security clearances, the committee access, the ability to move classified assets without scrutiny \u2014 all of it points back to Nova Crest."]}, {"h": "Personality \u2014 Inspired by Blaine (CEO of Boroughs)", "body": ["Thorne operates the way a scalpel does \u2014 precise, clean, and cold by design. He doesn't bluster. He doesn't threaten. He asks questions in a way that lets the other person think they're winning, right up until they're not. Charming to the point of being slightly dangerous \u2014 people want to impress him, which means they tell him things they shouldn't. He remembers everything. He uses it slowly.", "Underneath the polish is a man who has decided that his survival is simply more important than the rules everyone else agreed to follow. Not out of ego \u2014 out of a quiet, almost clinical certainty that he is the kind of person the world can't afford to lose. He believes this the way other people believe in gravity. It doesn't make him cruel. It makes him far more dangerous than cruel."]}, {"h": "What He Wants \u2014 In Order", "olist": ["Survive \u2014 access Nova Crest's biotech to find a cure or continuation", "Control \u2014 own the project entirely, not share it with Division 9 or anyone else", "Legacy \u2014 if he lives, the Senate seat becomes real power; if he doesn't, he wants to have mattered"]}, {"h": "Key Relationships", "rel": [{"ref": "keir", "name": "Division 9 / General Keir", "text": "Thorne is aware they exist but deliberately operates outside their knowledge. They would view him as an asset to control or eliminate \u2014 he views them as a bureaucratic obstacle sitting on top of something that belongs to him now."}, {"ref": "rachel", "name": "Rachel Adler", "text": "She may become aware of him before he knows she's watching. A collision is inevitable."}, {"ref": "kira", "name": "Kira Daniels", "text": "His campaign is exactly the kind of story Kira would investigate \u2014 too clean, too polished, too well-timed. She doesn't know about his illness yet. When she does, everything changes."}, {"ref": "kain", "name": "Dr. Kain", "text": "Thorne has read everything Kain has ever published. He considers him the only person alive who might actually save him. He intends to find him."}]}], "quotes": ["I didn't come this far to watch someone else make the decision.", "There's no such thing as an abandoned project. There's only unfinished work waiting for the right person.", "Leadership. Integrity. Progress. I mean every word. I just mean them for myself first."]}];
const SUPPORTING = [{"id": "leo", "short": "Leo", "name": "LEO", "stamp": "CONTRACTOR-77", "category": "supporting", "meta": [["Role", "Asher's tech partner and handler; off-site support"], ["ID", "CONTRACTOR-77"], ["Affiliation", "External contractor; Breach Unit tech support"], ["Voice", "Witty, sarcastic, but cautious"]], "blurb": "An ex-IT contractor turned off-site handler, helping Asher with hacking and data recovery while hiding a piece of stolen tech.", "sections": [{"h": "Background", "body": ["Leo is an ex-IT contractor who worked at a military outpost tied to the Second Lives handoff. He witnessed strange incidents before his contract was mysteriously terminated. He now operates outside the facility, helping Asher with hardware, data recovery, and hacking communications systems. His last name is redacted in official records."]}, {"h": "Motivation", "body": ["His brother died during the Nova Crest containment operation. He wants payback but knows a direct attack would get them killed."]}, {"h": "Secret", "body": ["He was offered hush money by Division 9 and turned it down \u2014 but took a piece of tech before leaving. That tech might hold memories that aren't his own."]}]}, {"id": "wang", "short": "Dr. Wang", "name": "DR. LIANG \"JIN\" WANG", "stamp": "SL-0213", "category": "supporting", "meta": [["Role", "Senior Parasitologist"], ["SL-ID", "SL-0213"], ["Affiliation", "Hemeon Research Group / Biological Research Division"]], "blurb": "A dry, data-obsessed senior parasitologist whose audio logs and testimony become crucial evidence in the True Ending.", "sections": [{"h": "Background", "body": ["Senior parasitologist at Hemeon, working on parasite research and neutralizers. His audio log #03 was recorded from Sublevel 2, Parasitology Wing B. His logs reveal detail on hybridization experiments, Subject 17-B, and neutralizer tests. He is shown in-game holed up in the Hydro & Plantation Lab during the outbreak, and his testimony becomes crucial evidence Jack transmits in the True Ending."]}, {"h": "Personality", "body": ["Dry, annoyed, intensely focused on data. Speaks with clipped urgency and a habit of treating the immediate crisis as secondary to whatever he's currently analyzing."]}]}, {"id": "lucus", "short": "Lucus Garcia", "name": "LUCUS GARCIA / \"LUCUS\"", "stamp": "SL-1184", "category": "supporting", "meta": [["Role", "Special Security Officer"], ["SL-ID", "SL-1184"], ["Status", "Becomes the Halfling parasite (Mimicus Replicantus)"]], "blurb": "A soft-spoken security officer who guides Jack through the facility before succumbing to infection and transforming into the Halfling.", "sections": [{"h": "Background", "body": ["Senior Security Officer at Hemeon. Guides Jack through the facility in the early portions of the game, serving as an anchoring presence amid the chaos. His last name (Garcia) appears redacted in the official directory, revealed only in the script.", "Cipher's internal log notes him as \"soft-spoken\" and someone who \"overperforms to avoid attention,\" fascinated by the clones \u2014 especially Theta-09. Cipher flagged him as not yet a threat but noted he \"asks too many philosophical questions during breaks\" and exhibits \"possible emotional transference or projection onto test subjects.\" Cipher suspected latent trauma and recommended increased exposure to failed clone degradation to test whether he detaches or spirals.", "He later succumbs to parasite infection and transforms into the Halfling in the White Room (Cryo Lab, Floor 10). His transformation is a major standoff moment for Jack. Prior to transforming, he has a tense confrontation with the Warden in the Observation Chamber."]}]}, {"id": "darby", "short": "Officer Darby", "name": "OFFICER ELAINE DARBY", "stamp": "SL-1192", "category": "supporting", "meta": [["Role", "Security Operations Manager"], ["SL-ID", "SL-1192"], ["Affiliation", "Corporate Security Services"]], "blurb": "A thorough, suspicious head of security who senses something is wrong but not quite deep enough to expose it.", "sections": [{"h": "Background", "body": ["Head of Security at Hemeon. Cipher's internal log profiles her as \"mid-40s, military career, competent, thorough, suspicious by default.\" She keeps handwritten notes and runs silent patrol checks at hours not listed on her official schedule \u2014 smart enough to know something is wrong but also smart enough to not look too deep. Cipher recommended reassigning her to surface rotation within two weeks, with a contingency protocol if she resisted. Appears in the game as a moral checkpoint \u2014 potential ally or obstacle depending on player choices."]}]}, {"id": "cipher", "short": "Cipher", "name": "\"CIPHER\"", "stamp": "SL-0458", "category": "supporting", "meta": [["Role", "Division 9 Analyst, Personnel Psychological Profiler"], ["SL-ID", "SL-0458"], ["Real Name", "[Redacted]"], ["Codename", "Cipher"], ["Affiliation", "Division 9 \u2014 Personnel Analysis & Monitoring Division"]], "blurb": "An embedded Division 9 psychological profiler whose private logs expose the cold calculus behind personnel decisions.", "sections": [{"h": "Background", "body": ["Cipher is identified only by codename in both the directory and script. An embedded Division 9 analyst operating inside Hemeon under a cleared cover identity with Division 9's backchannel override. Conducts full psychological mapping of primary personnel, categorizing behavior, habits, and anomalous patterns per Tier 4 directive. Maintains private \"letter logs\" as internal subjective analyses."]}, {"h": "Key Assessments from Log #01 (2013)", "list": ["Flagged Officer Darby for reassignment", "Identified Dr. Kain's emotional weakness as grief over his family \u2014 noted Rachel's \"empathy protocol\" to manipulate him", "Flagged Lucus for emotional projection onto test subjects; recommended exposure to failed clone degradation", "Proposed \"Project Mirror\" \u2014 parallel testing on lower-tier staff marked for termina al agenda. Infects hosts by consuming a sample of cells, blood, or flesh, then rapidly grows into a perfect physical clone of the individual. The clone shares memories and mannerisms of the original but is controlled by the parasite's hive intelligence. Clones degrade after 7\u201310 days, requiring fresh biological material.", "When a clone dies or is discovered, its body liquefies into a gelatinous mass that releases airborne spores. Appears as a translucent, pulsating biofilm that morphs into humanoid form over hours upon DNA contact. Clones exhibit subtle \"uncanny valley\" traits \u2014 mismatched eye pigmentation, faint bioluminescent veins under UV light."]}, {"h": "Known Host", "rel": [{"ref": "lucus", "name": "Lucus Garcia", "text": "Transforms into the Halfling in the White Room (Cryo Lab, Floor 10) after succumbing to infection."}]}]}, {"id": "warden", "short": "The Warden", "name": "THE WARDEN", "tag": "WARDEN", "meta": [["Classification", "Apex Hybrid Organism / Parasite Sovereign"], ["Human Host", "Asher Vance (transforms during game events)"], ["Boss Phases", "Phase 1 \u2014 Jailor of Flesh | Phase 2 \u2014 Parasite Sovereign"]], "blurb": "The ultimate parasite boss \u2014 a massive, bioluminescent entity that retains a distorted, self-aware vestige of Asher's consciousness.", "sections": [{"h": "Profile", "body": ["The ultimate parasite boss and the most powerful entity in the game. Asher Vance \u2014 the whistleblower technician \u2014 is discovered by the military and transformed into the Warden. His transformation occurs during the game's events and is discovered by Cipher's profile system. The Warden is a massive, vaguely humanoid entity covered in bioluminescent vines, emerging first in the Hydro & Plantation Lab.", "It appears to retain some vestige of Asher's consciousness \u2014 its dialogue is distorted, low, and eerily self-aware. Bioluminescent vines recoil from it as if in fear. In the Secret Ending, the Warden is revealed to be a failed const ALL_HUMANS = [...CORE, ...SUPPORTING];
const ENTRY_BY_ID = {};
ALL_HUMANS.forEach(e => ENTRY_BY_ID[e.id] = Object.assign({kind:'human'}, e));
PARASITES.forEach(e => ENTRY_BY_ID[e.id] = Object.assign({kind:'parasite'}, e));

function scanText(t, refs){
  const re = /href="#entry-([a-z0-9-]+)"/g; let m;
  while((m = re.exec(t))) refs.add(m[1]);
}
function collectRefs(entry){
  const refs = new Set();
  (entry.meta||[]).forEach(([,v]) => scanText(String(v), refs));
  (entry.sections||[]).forEach(s => {
    if(s.body) s.body.forEach(t => scanText(t, refs));
    if(s.list) s.list.forEach(t => scanText(t, refs));
    if(s.olist) s.olist.forEach(t => scanText(t, refs));
    if(s.rel) s.rel.forEach(r => { if(r.ref) refs.add(r.ref); scanText(r.text||'', refs); });
  });
  refs.delete(entry.id);
  return refs;
}
const backlinkMap = {};
Object.values(ENTRY_BY_ID).forEach(entry => {
  collectRefs(entry).forEach(target => {
    if(!backlinkMap[target]) backlinkMap[target] = new Set();
    backlinkMap[target].add(entry.id);
  });
});

const SEARCH_INDEX = [];
CORE.forEach(e => SEARCH_INDEX.push({id:e.id, name:e.short, cat:'Core Narrative', hash:'entry-'+e.id}));
SUPPORTING.forEach(e => SEARCH_INDEX.push({id:e.id, name:e.short, cat:'Supporting Cast', hash:'entry-'+e.id}));

STAFF_DIVISIONS.forEach(d => d.members.forEach(m => SEARCH_INDEX.push({id:d.id, name:m.name, cat:d.name, hash:'cat-staff:div-'+d.id})));
MISC_NOTES.forEach((n,i) => SEARCH_INDEX.push({id:'note'+i, name:n.title, cat:'Narrative Note', hash:'cat-misc:note-'+i}));

/* ============================================================
   FORMAT HELPERS
   ============================================================ */
function fmtMeta(v){
  return String(v).replace(/\b(SL-\d{4}|CONTRACTOR-\d+)\b/g, '<span class="code">$1</span>');
}
function metaGrid(meta){
  return '<div class="meta-grid">' + meta.map(([k,v]) => `<div class="meta-item"><span class="meta-k">${k}</span><span class="meta-v">${fmtMeta(v)}</span></div>`).join('') + '</div>';
}
function renderSection(s){
  let inner = '';
  if(s.body) inner = s.body.map(p => `<p>${p}</p>`).join('');
  else if(s.list) inner = `<ul>${s.list.map(li => `<li>${li}</li>`).join('')}</ul>`;
  else if(s.olist) inner = `<ol>${s.olist.map(li => `<li>${li}</li>`).join('')}</ol>`;
  else if(s.rel) inner = `<ul class="rel-list">${s.rel.map(r => `<li><a class="xref rel-name" href="#entry-${r.ref}">${r.name}</a><span class="rel-text">${r.text}</span></li>`).join('')}</ul>`;
  return `<section class="file-section"><h2>${s.h}</h2>${inner}</section>`;
}
function getBacklinks(id, currentAccentClass){
  const set = backlinkMap[id];
  if(!set || !set.size) return '';
  const chips = [...set].map(rid => {
    const e = ENTRY_BY_ID[rid];
    if(!e) return '';
    return `<a class="chip" href="#entry-${rid}">${e.short}</a>`;
  }).join('');
  return `<section class="file-section backlinks"><h2>Cross-References</h2><div class="chip-row">${chips}</div></section>`;
}
function breadcrumb(parts){
  return '<div class="crumbs">' + parts.map((p,i) => {
    const isLast = i === parts.length - 1;
    const sep = i > 0 ? '<span class="sep">/</span>' : '';
    return sep + (isLast ? `<span class="current">${p[0]}</span>` : `<a href="#${p[1]}">${p[0]}</a>`);
  }).join('') + '</div>';
}

function renderParasiteCategory(){
  const cards = PARASITES.map(e => `
    <a class="p-card accent-parasite" href="#entry-${e.id}">
      <div class="p-card-top"><span class="p-card-name">${e.short}</span><span class="p-card-tag">${e.tag}</span></div>
      <div class="p-card-role">${e.meta[0][1]}</div>
      <div class="p-card-blurb">${e.blurb}</div>
    </a>`).join('');
  return `
    <div class="fade-in accent-parasite">
      ${breadcrumb([['Archive','home'],['Parasite Specimens','']])}
      <div class="threat-banner">
        ${ICON_BIO}
        <div class="threat-banner-text"><b>SPECIMEN DIVISION — CONTAINMENT DOSSIER.</b> Catalogued separately from human personnel per Hemeon Biological Research protocol. Seven strains on record, from the 1959 origin host to the apex organism designated The Warden.</div>
      </div>
      <div class="section-head"><h2>Parasite Specimens</h2><p>From the Classified Parasitology Dossier. Every catalogued strain descends — directly or through hybridization — from Specimen 07-A.</p></div>
      <div class="card-grid">${cards}</div>
    </div>`;
}

function renderStaffCategory(){
  const divs = STAFF_DIVISIONS.map(d => `
    <div class="staff-division" id="div-${d.id}">
      <div class="staff-head"><h3>${d.name}</h3><span class="tile-count">${d.members.length}</span></div>
      <div class="roster">
        <div class="roster-row head"><span>Name</span><span>SL-ID</span><span>Role</span></div>
        ${d.members.map(m => `<div class="roster-row"><span class="roster-name">${m.name}</span><span class="roster-id">${m.sl||'—'}</span><span class="roster-role">${m.role}</span></div>`).join('')}
      </div>
    </div>`).join('');
  return `
    <div class="fade-in">
      ${breadcrumb([['Archive','home'],['Corporation Staff','']])}
      <div class="section-head"><h2>Second Lives Corporation — Staff</h2><p>Thirty-two personnel of record across nine operational divisions. Minor roles; full narrative dossiers are not on file for this tier.</p></div>
      ${divs}
    </div>`;
}

function renderMiscCategory(){
  const cards = MISC_NOTES.map((n,i) => `
    <div class="note-card" id="note-${i}">
      <h3>${n.title}</h3>
      <p>${n.body}</p>
    </div>`).join('');
  return `
    <div class="fade-in">
      ${breadcrumb([['Archive','home'],['Misc. &amp; Narrative Notes','']])}
      <div class="section-head"><h2>Miscellaneous &amp; Narrative Notes</h2><p>Environmental lore and background groups referenced throughout the facility.</p></div>
      <div class="note-grid">${cards}</div>
    </div>`;
}

function renderAffiliationsCategory(){
  const cards = AFFILIATIONS.map((a,i) => `
    <div class="aff-card" id="aff-${i}">
      <h3>${a.title}</h3>
      ${a.body ? `<p>${a.body}</p>` : ''}
      <ul>${a.members.map(m => `<li><a class="xref" href="#entry-${m.ref}">${m.name}</a>${m.role ? `<span class="aff-role">${m.role}</span>` : ''}</li>`).join('')}</ul>
    </div>`).join('');
  return `
    <div class="fade-in">
      ${breadcrumb([['Archive','home'],['Key Affiliations','']])}
      <div class="section-head"><h2>Key Affiliations</h2><p>How every faction — corporate, military, and resistance — connects.</p></div>
      <div class="aff-grid">${cards}</div>
    </div>`;
}

function renderEntry(id){
  const e = ENTRY_BY_ID[id];
  if(!e) return renderHome();
  const isParasite = e.kind === 'parasite';
  const catLabel = isParasite ? 'Parasite Specimens' : (e.category === 'core' ? 'Core Narrative' : 'Supporting Cast');
  const catHash = isParasite ? 'cat-parasites' : (e.category === 'core' ? 'cat-core' : 'cat-supporting');
  const stampContent = isParasite ? `${ICON_BIO}${e.tag}` : e.stamp;
  const eyebrowText = isParasite ? 'Specimen File' : (e.category === 'core' ? 'Core Narrative File' : 'Supporting File');
  const sectionsHtml = e.sections.map(renderSection).join('');
  const quotesHtml = (e.quotes && e.quotes.length) ? `<section class="file-section quotes-section"><h2>${e.quoteLabel || 'Key Quotes'}</h2><div class="quotes">${e.quotes.map(q => `<blockquote>${q}</blockquote>`).join('')}</div></section>` : '';
  const backlinksHtml = getBacklinks(e.id);
  return `
    <div class="fade-in${isParasite ? ' accent-parasite' : ''}">
      ${breadcrumb([['Archive','home'],[catLabel,catHash],[e.short,'']])}
      <div class="file-head bracket">
        <div class="stamp">${stampContent}</div>
        <div class="eyebrow">${eyebrowText}</div>
        <h1>${e.name}</h1>
        ${metaGrid(e.meta)}
      </div>
      ${sectionsHtml}
      ${quotesHtml}
      ${backlinksHtml}
    </div>`;
}

/* ============================================================
   SIDEBAR
   ============================================================ */
function navLink(hash, label, cls){
  return `<a href="#${hash}" class="${cls||'nav-child'}" data-hash="${hash}">${label}</a>`;
}
function navGroup(hash, label, count, childrenHtml, danger){
  return `
    <div class="nav-group open${danger?' danger':''}" data-group="${hash}">
      <div class="nav-group-head">
        <a href="#${hash}" class="nav-cat-link" data-hash="${hash}">
          ${danger ? `<span class="nav-bio">${ICON_BIO}</span>` : ''}
          <span class="nav-label">${label}</span>
          <span class="nav-count">${count}</span>
        </a>
        <button class="nav-toggle" aria-label="Toggle section"><span>&#8964;</span></button>
      </div>
      <div class="nav-children">${childrenHtml}</div>
    </div>`;
}
function buildSidebar(){
  const sidebar = document.getElementById('sidebar');
  let html = `<a href="#home" class="nav-home" data-hash="home">${ICON_HOME}<span>Overview</span></a>`;
  html += navGroup('cat-core', 'Core Narrative', CORE.length, CORE.map(e => navLink('entry-'+e.id, e.short)).join(''));
  html += navGroup('cat-supporting', 'Supporting Cast', SUPPORTING.length, SUPPORTING.map(e => navLink('entry-'+e.id, e.short)).join(''));
  html += navGroup('cat-parasites', 'Parasite Specimens', PARASITES.length, PARASITES.map(e => navLink('entry-'+e.id, e.short)).join(''), true);
  html += navGroup('cat-staff', 'Corporation Staff', 32, STAFF_DIVISIONS.map(d => navLink('cat-staff:div-'+d.id, d.name+' ('+d.members.length+')')).join(''));
  html += navGroup('cat-misc', 'Misc. Notes', MISC_NOTES.length, MISC_NOTES.map((n,i) => navLink('cat-misc:note-'+i, n.title)).join(''));
  html += navGroup('cat-affiliations', 'Key Affiliations', AFFILIATIONS.length, AFFILIATIONS.map((a,i) => navLink('cat-affiliations:aff-'+i, a.title)).join(''));
  html += `<div class="nav-foot">SECOND LIVES / DIVISION 9 UNIVERSE<br>Compiled from: Full Script (8), Complete Character List, Master Timeline</div>`;
  sidebar.innerHTML = html;

  sidebar.querySelectorAll('.nav-toggle').forEach(btn => {
    btn.addEventListener('click', (ev) => {
      ev.preventDefault();
      btn.closest('.nav-group').classList.toggle('open');
    });
  });
}
function updateSidebarActive(routeHash){
  document.querySelectorAll('.nav-home, .nav-cat-link, .nav-child').forEach(el => {
    el.classList.toggle('is-active', el.dataset.hash === routeHash);
  });
}

/* ============================================================
   ROUTER
   ============================================================ */
function renderCategory(cat){
  switch(cat){
    case 'core': return renderCardGrid('Core Narrative Characters', 'The seven principal figures driving the Second Lives storyline.', CORE);
    case 'supporting': return renderCardGrid('Supporting &amp; Side Characters', 'Secondary figures who deepen the world and connect the principal cast.', SUPPORTING);
    case 'parasites': return renderParasiteCategory();
    case 'staff': return renderStaffCategory();
    case 'misc': return renderMiscCategory();
    case 'affiliations': return renderAffiliationsCategory();
    default: return renderHome();
  }
}
function router(){
  const raw = (location.hash || '#home').slice(1);
  const [main, sub] = raw.split(':');
  const contentInner = document.getElementById('contentInner');
  let html, activeHash;

  if(main === '' || main === 'home'){ html = renderHome(); activeHash = 'home'; }
  else if(main.startsWith('cat-')){ html = renderCategory(main.slice(4)); activeHash = main; }
  else if(main.startsWith('entry-')){ html = renderEntry(main.slice(6)); activeHash = main; }
  else { html = renderHome(); activeHash = 'home'; }

  contentInner.innerHTML = html;
  document.getElementById('content').scrollTop = 0;
  updateSidebarActive(activeHash);
  closeMobileNav();

  if(sub){
    requestAnimationFrame(() => {
      const el = document.getElementById(sub);
      if(el){ el.scrollIntoView({behavior:'smooth', block:'start'}); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1200); }
    });
  }
}
window.addEventListener('hashchange', router);

/* ============================================================
   SEARCH
   ============================================================ */
const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');
function renderSearch(q){
  const query = q.trim().toLowerCase();
  if(!query){ searchResults.classList.remove('open'); searchResults.innerHTML=''; return; }
  const matches = SEARCH_INDEX.filter(item => item.name.toLowerCase().includes(query) || item.cat.toLowerCase().includes(query)).slice(0, 10);
  if(!matches.length){
    searchResults.innerHTML = `<div class="sr-empty">No records match “${q}”.</div>`;
  } else {
    searchResults.innerHTML = matches.map(m => `<a class="sr-item" href="#${m.hash}"><span class="sr-name">${m.name}</span><span class="sr-cat">${m.cat}</span></a>`).join('');
  }
  searchResults.classList.add('open');
}
searchInput.addEventListener('input', e => renderSearch(e.target.value));
searchInput.addEventListener('focus', e => { if(e.target.value) renderSearch(e.target.value); });
document.addEventListener('click', e => {
  if(!e.target.closest('.search-wrap')){ searchResults.classList.remove('open'); }
});
searchResults.addEventListener('click', () => { searchInput.value=''; searchResults.classList.remove('open'); searchResults.innerHTML=''; });
searchInput.addEventListener('keydown', e => { if(e.key === 'Escape'){ searchInput.value=''; searchResults.classList.remove('open'); searchInput.blur(); } });

/* ============================================================
   MOBILE NAV
   ============================================================ */
const sidebarEl = document.getElementById('sidebar');
const backdropEl = document.getElementById('backdrop');
document.getElementById('menuBtn').addEventListener('click', () => {
  sidebarEl.classList.toggle('open');
  backdropEl.classList.toggle('open');
});
backdropEl.addEventListener('click', closeMobileNav);
function closeMobileNav(){
  if(window.innerWidth <= 900){ sidebarEl.classList.remove('open'); backdropEl.classList.remove('open'); }
}

/* ============================================================
   INIT
   ============================================================ */
buildSidebar();
router();
</script>
</body>
</html>
